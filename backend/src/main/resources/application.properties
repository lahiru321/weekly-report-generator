spring.application.name=weekly-report-backend
server.port=${PORT:8081}

# Database (defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/weekly_report}
spring.datasource.username=${DB_USER:weekly}
spring.datasource.password=${DB_PASSWORD:weekly}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Loads lazy collections (tasks, blockers...) for many reports in one query instead of N queries
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# Auth
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars-long}
app.jwt.expiration-minutes=480
app.jwt.cookie-name=access_token
app.jwt.cookie-secure=${COOKIE_SECURE:false}

# Demo data
app.seed.enabled=${SEED_ENABLED:true}

# Users come from our own database, so skip Spring's generated in-memory user and password
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
