services:
  postgres:
    image: postgres:16-alpine
    container_name: weekly-report-db
    environment:
      POSTGRES_DB: weekly_report
      POSTGRES_USER: weekly
      POSTGRES_PASSWORD: weekly
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
